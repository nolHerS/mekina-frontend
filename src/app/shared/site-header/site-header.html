<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="#inicio" aria-label="Barbería Mekina, inicio" (click)="closeMenu()">
      <!-- Replace this monogram with the supplied logo at public/assets/brand/logo.svg when available. -->
      <span class="brand__mark" aria-hidden="true">M</span>
      <span class="brand__name"><span>BARBERÍA</span><strong>MEKINA</strong></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      (click)="menuOpen.update((isOpen) => !isOpen)"
    >
      <span class="menu-toggle__icon" [class.menu-toggle__icon--open]="menuOpen()" aria-hidden="true">
        <span></span>
        <span></span>
      </span>
      <span class="visually-hidden">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
    </button>

    <nav
      class="primary-navigation"
      id="primary-navigation"
      aria-label="Navegación principal"
      [class.primary-navigation--open]="menuOpen()"
    >
      @for (link of links; track link.href) {
        <a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a class="primary-navigation__mobile-cta" href="#mi-cita" (click)="closeMenu()">
        Reservar cita <span aria-hidden="true">↗</span>
      </a>
    </nav>

    <a class="header-cta" href="#mi-cita">
      Reservar cita <span aria-hidden="true">↗</span>
    </a>
  </div>
</header>
