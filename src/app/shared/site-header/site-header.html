<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="site-header" (keydown.escape)="handleEscape()">
  <div class="site-header__inner">
    <a
      class="brand"
      routerLink="/"
      fragment="inicio"
      aria-label="Barbería Mekina, inicio"
      (click)="closeMenu()"
    >
      <span class="brand__logo-frame">
        <img
          class="brand__logo"
          ngSrc="/images/logo_mekina.png"
          width="814"
          height="559"
          alt=""
          priority
        />
      </span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      (click)="menuOpen.update((isOpen) => !isOpen)"
    >
      <span
        class="menu-toggle__icon"
        [class.menu-toggle__icon--open]="menuOpen()"
        aria-hidden="true"
      >
        <span></span>
        <span></span>
      </span>
      <span class="visually-hidden">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
    </button>

    <nav
      class="primary-navigation"
      id="primary-navigation"
      aria-label="Navegación principal"
      [class.primary-navigation--open]="menuOpen()"
    >
      @for (link of links; track link.label) {
        <a
          [routerLink]="link.route ?? '/'"
          [fragment]="link.fragment ?? undefined"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <a class="header-cta" routerLink="/reservar" (click)="closeMenu()">
      Reservar cita <span aria-hidden="true">↗</span>
    </a>
  </div>
</header>
